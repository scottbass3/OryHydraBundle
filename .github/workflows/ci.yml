name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}${{ matrix.lowest && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', symfony: '6.4.*', lowest: true }
          - { php: '8.2', symfony: '6.4.*' }
          - { php: '8.3', symfony: '7.*' }
          - { php: '8.4', symfony: '8.*' }
          - { php: '8.5', symfony: '8.*' }
    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony }}
      SYMFONY_DEPRECATIONS_HELPER: ${{ matrix.lowest && 'disabled=1' || 'max[direct]=0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install symfony/flex to apply SYMFONY_REQUIRE
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts symfony/flex

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ matrix.symfony }}-${{ matrix.lowest }}-${{ hashFiles('composer.json') }}

      - run: composer update --no-progress --prefer-dist ${{ matrix.lowest && '--prefer-lowest' || '' }}

      - run: vendor/bin/phpunit

  quality:
    name: PHPStan and coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer update --no-progress --prefer-dist

      - run: vendor/bin/phpstan analyse --no-progress

      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1
